/* ---------- storage ---------- */
const K_TASKS='fim_tasks_v1',K_CHECK='fim_checks_v1',K_THEME='fim_theme',K_KEY='fim_apikey';
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tasks=ls.get(K_TASKS,null)||SEED.slice();
SEED.forEach(t=>{ if(!tasks.some(x=>x.id===t.id)) tasks.push(t); });
let checks=ls.get(K_CHECK,{});   // {taskId:{causeIndex:true}}
const saveTasks=()=>ls.set(K_TASKS,tasks), saveChecks=()=>ls.set(K_CHECK,checks);
const $=id=>document.getElementById(id);
const toast=(m,err)=>{const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2200);};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- theme ---------- */
function applyTheme(t){document.documentElement.dataset.theme=t;$('btnTheme').textContent=t==='light'?'Dark':'Light';}
applyTheme(ls.get(K_THEME,'dark'));
$('btnTheme').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';applyTheme(t);ls.set(K_THEME,t);};

/* ---------- search ---------- */
const SYN={cockpit:'flight deck control cabin cont cab',cold:'too cold temperature',hot:'too hot temperature',airflow:'air flow',ac:'air conditioning pack','a/c':'air conditioning pack',press:'pressurization pressure',cb:'circuit breaker'};
function tokens(s){return s.toLowerCase().replace(/[^a-z0-9\-\/ ]/g,' ').split(/\s+/).filter(Boolean);}
function expand(toks){const out=[...toks];toks.forEach(t=>{if(SYN[t])out.push(...tokens(SYN[t]));});return out;}
function cbText(t){return Array.isArray(t.cbs)?t.cbs.map(b=>[b.panel,b.num,b.name].join(' ')).join(' '):(t.cbs||'');}
function score(t,toks){
  const hay={task:t.task.toLowerCase(),title:t.title.toLowerCase(),desc:(t.desc||'').toLowerCase(),causes:(t.causes.join(' ')+' '+cbText(t)+' '+(t.steps||[]).join(' ')+' '+(t.confirm||[]).join(' ')).toLowerCase(),kw:(t.keywords||'').toLowerCase()};
  let s=0,hits=0;
  toks.forEach(k=>{
    let h=0;
    if(hay.task.includes(k)) h+=10;
    if(hay.title.includes(k)) h+=6;
    if(hay.desc.includes(k)) h+=3;
    if(hay.causes.includes(k)) h+=3;
    if(hay.kw.includes(k)) h+=2;
    if(h){hits++;s+=h;}
  });
  return hits?s+hits*4:0;
}
function hl(text,toks){let out=esc(text);toks.filter(k=>k.length>2).forEach(k=>{out=out.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');});return out;}

function render(){
  const q=$('q').value.trim();
  const toks=q?expand(tokens(q)):[];
  let list=tasks.map(t=>({t,s:toks.length?score(t,toks):1})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.t.task.localeCompare(b.t.task));
  $('status').textContent=q?`${list.length} match${list.length===1?'':'es'} in ${tasks.length} tasks`:`${tasks.length} tasks loaded — type a fault to filter`;
  const box=$('results');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="empty">No task matches. Try fewer words, a component name (V48, T478), or add the task.</div>';return;}
  list.forEach(({t},i)=>box.appendChild(taskEl(t,toks,q&&i<3)));
}
function listHtml(t,c,toks,field,label,pre){
  const arr=t[field]; if(!Array.isArray(arr)||!arr.length) return '';
  return `<h4>${label}</h4>`+arr.map((x,i)=>{const k=pre+i;return `<div class="cause ${c[k]?'done':''}"><input type="checkbox" class="chk" id="${t.id}-${k}" data-i="${k}" ${c[k]?'checked':''}><label for="${t.id}-${k}"><span class="stepno">${i+1}</span>${hl(x,toks)}</label></div>`;}).join('');
}
function cbHtml(t,c,toks){
  if(!t.cbs||(Array.isArray(t.cbs)&&!t.cbs.length)) return '';
  if(!Array.isArray(t.cbs)) return `<h4>Circuit breakers</h4><div class="cb">${esc(t.cbs)}</div>`;
  return `<h4>Circuit breakers</h4>`+t.cbs.map((b,i)=>{const k='cb'+i;return `<div class="cause ${c[k]?'done':''}"><input type="checkbox" class="chk" id="${t.id}-${k}" data-i="${k}" ${c[k]?'checked':''}><label for="${t.id}-${k}"><b class="cbnum">${esc(b.panel||'')} ${esc(b.row||'')}-${esc(b.col||'')}</b> ${hl(b.name||'',toks)}</label></div>`;}).join('');
}
function taskEl(t,toks,open){
  const c=checks[t.id]||{};
  const done=Object.keys(c).filter(k=>c[k]&&/^\d+$/.test(k)).length;
  const d=document.createElement('article');d.className='task'+(open?' open':'');
  d.innerHTML=`
    <div class="task-head" role="button" tabindex="0" aria-expanded="${open}">
      <div><div class="num">TASK ${esc(t.task)}</div><p class="title">${hl(t.title,toks)}</p></div>
      <div class="prog">${done}/${t.causes.length}</div>
    </div>
    <div class="body">
      ${t.desc?`<p class="desc">${hl(t.desc,toks)}</p>`:''}
      <div class="eff">Effective on: ${esc(t.eff||'')}</div>
      <h4>Possible causes</h4>
      ${t.causes.map((cz,i)=>`<div class="cause ${c[i]?'done':''}"><input type="checkbox" class="chk" id="${t.id}-${i}" data-i="${i}" ${c[i]?'checked':''}><label for="${t.id}-${i}">${i+1}. ${hl(cz,toks)}</label></div>`).join('')}
      ${cbHtml(t,c,toks)}
      ${listHtml(t,c,toks,'steps','Fault isolation steps','st')}
      ${listHtml(t,c,toks,'confirm',t.confirmLabel||'Repair confirmation','rc')}
      <div class="actions">
        <button class="btn small ghost" data-a="reset">Reset checks</button>
        <button class="btn small ghost" data-a="edit">Edit</button>
        <button class="btn small ghost" data-a="del">Delete</button>
      </div>
    </div>`;
  const head=d.querySelector('.task-head');
  const tog=()=>{d.classList.toggle('open');head.setAttribute('aria-expanded',d.classList.contains('open'));};
  head.onclick=tog; head.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}};
  d.querySelectorAll('.chk').forEach(ch=>ch.onchange=()=>{checks[t.id]=checks[t.id]||{};checks[t.id][ch.dataset.i]=ch.checked;saveChecks();ch.closest('.cause').classList.toggle('done',ch.checked);d.querySelector('.prog').textContent=`${Object.keys(checks[t.id]).filter(k=>checks[t.id][k]&&/^\d+$/.test(k)).length}/${t.causes.length}`;});
  d.querySelector('[data-a=reset]').onclick=()=>{delete checks[t.id];saveChecks();render();};
  d.querySelector('[data-a=edit]').onclick=()=>openForm(t);
  d.querySelector('[data-a=del]').onclick=()=>{if(confirm('Delete task '+t.task+'?')){tasks=tasks.filter(x=>x.id!==t.id);delete checks[t.id];saveTasks();saveChecks();render();}};
  return d;
}
$('q').oninput=render;
$('qx').onclick=()=>{$('q').value='';render();$('q').focus();};

/* quick chips from ATA titles */
function renderChips(){
  const words=['AUTO FAIL','PACK light','RAM DOOR','HI CAB ALT','DIFF PRESS','LDG GEAR DISAGREE','ZONE SELECTOR','CONTROLLER FAULT','THIS PACK','TRIM VALVE','ZONE TEMP light','RAM AIR ACT','cannot cool','too cold','AUTO temp','temp indication','door heater'];
  $('chips').innerHTML=words.map(w=>`<button class="chip">${esc(w)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('q').value=b.textContent;render();});
}

/* ---------- add / edit ---------- */
let editing=null;
const lines=t=>t.split('\n').map(l=>l.trim()).filter(Boolean);
function parseCbs(txt){
  const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean); if(!lines.length) return [];
  const out=[];lines.forEach(l=>{const m=l.match(/^(\S+)\s+([A-Z])\s+(\d+)\s+(C\d{5})\s+(.+)$/i);if(m)out.push({panel:m[1],row:m[2].toUpperCase(),col:m[3],num:m[4].toUpperCase(),name:m[5]});else out.push({panel:'',row:'',col:'',num:'',name:l});});
  return out;
}
function openForm(t){
  editing=t||null;const f=$('frm');
  f.task.value=t?t.task:'';f.title.value=t?t.title:'';f.desc.value=t?t.desc||'':'';f.causes.value=t?t.causes.join('\n'):'';f.cbs.value=t?(Array.isArray(t.cbs)?t.cbs.map(b=>[b.panel,b.row,b.col,b.num,b.name].join(' ')).join('\n'):t.cbs||''):'';f.eff.value=t?t.eff||'':'DAL ALL 701-777, 801-999';f.steps.value=t?(t.steps||[]).join('\n'):'';f.confirm.value=t?(t.confirm||[]).join('\n'):'';
  $('dlg').showModal();
}
$('btnAdd').onclick=()=>openForm();
$('dlgCancel').onclick=()=>$('dlg').close();
$('frm').onsubmit=e=>{
  const f=e.target;const causes=f.causes.value.split('\n').map(s=>s.trim()).filter(Boolean);
  const rec={id:editing?editing.id:f.task.value.trim(),task:f.task.value.trim(),title:f.title.value.trim(),desc:f.desc.value.trim(),causes,steps:lines(f.steps.value),confirm:lines(f.confirm.value),cbs:parseCbs(f.cbs.value),eff:f.eff.value.trim(),ata:f.task.value.slice(0,5),keywords:editing?editing.keywords||'':''};
  if(editing){Object.assign(editing,rec);} else { if(tasks.some(x=>x.id===rec.id)){toast('That task number already exists',true);return;} tasks.push(rec); }
  saveTasks();render();
};

/* ---------- import / export ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('btnExport').onclick=()=>download('fim_tasks.json',JSON.stringify(tasks,null,2),'application/json');
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=async ev=>{
  try{const arr=JSON.parse(await ev.target.files[0].text());let n=0;
    arr.forEach(t=>{if(t.task&&Array.isArray(t.causes)){t.id=t.id||t.task;const i=tasks.findIndex(x=>x.id===t.id);if(i>=0)tasks[i]=t;else tasks.push(t);n++;}});
    saveTasks();render();toast(`Imported ${n} tasks`);
  }catch(e){toast('Import failed: not valid JSON',true);}
  ev.target.value='';
};
$('btnReset').onclick=()=>{if(confirm('Uncheck every cause in every task?')){checks={};saveChecks();render();}};

/* ---------- add from photo (Claude vision, optional) ---------- */
const getKey=()=>{try{return localStorage.getItem(K_KEY)||''}catch(e){return ''}};
$('btnKey').onclick=()=>{const k=prompt('Anthropic API key (sk-ant-…). Stored only in this browser. Only needed for "Add from photo" outside the Claude chat.',getKey());if(k===null)return;try{k.trim()?localStorage.setItem(K_KEY,k.trim()):localStorage.removeItem(K_KEY)}catch(e){}updKey();};
function updKey(){$('btnKey').textContent=getKey()?'API key ✓':'API key';} updKey();
function headers(){const h={'Content-Type':'application/json'};const k=getKey();if(k){h['x-api-key']=k;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true';}return h;}
const PROMPT=`This is a photo of a Boeing 737 FIM (Fault Isolation Manual) task page. Extract the task. Return ONLY JSON, no markdown:
{"task":"21-62-00-810-901","title":"Control Cabin Too Cold, No Temperature Control in AUTO - Fault Isolation","eff":"DAL ALL 701-777, 801-999","desc":"description/indications text, keep (a)(b)(c) lines","causes":["each possible cause exactly as written, include component IDs like V48, T478, M1653"],"cbs":[{"panel":"P6-4","row":"D","col":"8","num":"C00076","name":"AIR CONDITIONING TEMP IND"}],"steps":["each Fault Isolation Procedure step, plain language, one sentence each, include AMM task numbers"],"confirm":["each Repair Confirmation step"]}
Read circuit breakers from the Row/Col/Number/Name table if present; empty array if none visible. steps and confirm are empty arrays if those sections are not on the page.`;
function fileToImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('undecodable image'));i.src=u;});}
async function prepare(file,max){const img=await fileToImage(file);const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85).split(',')[1];}
$('btnPhoto').onclick=()=>$('filePhoto').click();
$('filePhoto').onchange=async ev=>{
  const files=[...ev.target.files];ev.target.value='';if(!files.length)return;
  toast(`Reading ${files.length} photo${files.length>1?'s':''}…`);
  let n=0;
  await Promise.all(files.map(async f=>{
    try{
      const b64=await prepare(f,1600);
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:headers(),body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:PROMPT}]}]})});
      const raw=await res.text();let data;try{data=JSON.parse(raw)}catch(e){throw new Error('API '+res.status)}
      if(res.status===401&&!getKey())throw new Error('Not inside Claude chat — add your API key');
      if(!res.ok)throw new Error(data.error?.message||('API '+res.status));
      const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').replace(/```json|```/g,'');
      const o=JSON.parse(text.slice(text.indexOf('{'),text.lastIndexOf('}')+1));
      if(!o.task||!Array.isArray(o.causes))throw new Error('no task found in photo');
      o.id=o.task;o.ata=o.task.slice(0,5);o.keywords='';
      const i=tasks.findIndex(x=>x.id===o.id);if(i>=0)tasks[i]=o;else tasks.push(o);n++;
    }catch(err){toast('Photo failed: '+err.message,true);}
  }));
  saveTasks();render();if(n)toast(`Added ${n} task${n>1?'s':''}`);
};

renderChips();render();
