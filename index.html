<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>737 FIM Fault Search</title>
<style>
  :root{
    --bg:#0f2a5a; --acc:#7fb8ff; --acc-dim:#3a5a94; --glow:rgba(127,184,255,.16);
    --ink:#fff; --ink-dim:#a9bde0; --ok:#7ee0a0; --err:#ff8a8a; --card:#163a78; --line:#264c8c; --r:10px;
  }
  html[data-theme=light]{
    --bg:#fff; --acc:#1a5fd1; --acc-dim:#b9cdf0; --glow:rgba(26,95,209,.08);
    --ink:#111; --ink-dim:#5a6470; --ok:#1f8a3a; --err:#c62828; --card:#f3f6fb; --line:#e1e6ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--acc-dim);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:18px;color:var(--acc);font-weight:700}
  h1 span{color:var(--ink-dim);font-weight:400}
  main{padding:14px 16px 110px;max-width:860px;margin:0 auto}
  .btn{border-radius:var(--r);background:var(--bg);color:var(--acc);border:1px solid var(--acc);padding:11px 16px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
  .btn:hover,.btn:focus-visible{background:var(--glow);outline:none}
  .btn.primary{background:var(--acc);color:var(--bg);font-weight:600}
  .btn.small{padding:6px 10px;min-height:32px;font-size:13px}
  .btn.ghost{border-color:var(--acc-dim);color:var(--ink-dim)}
  .btn:disabled{opacity:.4}
  input[type=file]{display:none}

  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;font:inherit;font-size:19px;padding:14px 46px 14px 16px;border-radius:14px;border:2px solid var(--acc-dim);background:var(--card);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--acc)}
  .search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ink-dim);font-size:22px;cursor:pointer;padding:6px 10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--acc-dim);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink-dim);cursor:pointer;background:none;font:inherit}
  .chip:hover{color:var(--acc);border-color:var(--acc)}
  .status{color:var(--ink-dim);font-size:14px;margin:0 0 10px}

  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .task-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
  .task-head .num{color:var(--acc);font-weight:700;font-size:15px;letter-spacing:.02em}
  .task-head .title{font-size:19px;font-weight:600;margin:2px 0 0}
  .task-head .prog{color:var(--ink-dim);font-size:14px;white-space:nowrap;margin-top:6px}
  .body{display:none;margin-top:10px}
  .task.open .body{display:block}
  .desc{color:var(--ink-dim);font-size:15px;margin:0 0 10px;white-space:pre-wrap}
  .eff{font-size:13px;color:var(--ink-dim);margin-bottom:10px}
  h4{margin:12px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
  .cause{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
  .cause:first-of-type{border-top:0}
  .cause label{cursor:pointer;font-size:17px}
  .cause.done label{opacity:.5;text-decoration:line-through}
  .chk{width:26px;height:26px;margin-top:2px;appearance:none;border:2px solid var(--acc);border-radius:7px;background:var(--bg);cursor:pointer;position:relative}
  .chk:checked{background:var(--acc)}
  .chk:checked::after{content:"";position:absolute;left:8px;top:2px;width:7px;height:14px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .chk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .cb{font-size:15px;color:var(--ink-dim)}
  .stepno{display:inline-block;min-width:22px;color:var(--ink-dim);font-weight:600}
  .cbnum{color:#ff9f43;font-weight:700;margin-right:6px;white-space:nowrap}
  html[data-theme=light] .cbnum{color:#d9640a}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  mark{background:var(--glow);color:var(--acc);border-radius:3px;padding:0 2px}
  .empty{color:var(--ink-dim);text-align:center;padding:50px 10px;border:1px dashed var(--line);border-radius:14px}

  footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--acc-dim);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
  dialog{border-radius:14px;background:var(--bg);color:var(--ink);border:1px solid var(--acc);max-width:92vw;width:640px;padding:16px;font:inherit}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog input,dialog textarea{width:100%;font:inherit;font-size:15px;padding:9px;border-radius:8px;border:1px solid var(--acc-dim);background:var(--card);color:var(--ink);margin:4px 0 10px}
  dialog textarea{min-height:110px;resize:vertical}
  dialog label{font-size:13px;color:var(--ink-dim)}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);border-radius:var(--r);background:var(--bg);border:1px solid var(--acc);color:var(--acc);padding:10px 16px;z-index:20;max-width:90vw;font-size:14px}
  .toast.err{border-color:var(--err);color:var(--err)}
</style>
</head>
<body>
<header>
  <h1>737 FIM Fault Search <span>possible causes checklist</span></h1>
  <button class="btn small ghost" id="btnTheme" aria-label="Toggle light or dark mode">Light</button>
</header>

<main>
  <div class="search">
    <input id="q" type="search" placeholder="Type the fault: auto fail, cabin too cold, low air flow, V48…" autocomplete="off" autofocus>
    <button class="x" id="qx" aria-label="Clear search">×</button>
  </div>
  <div class="chips" id="chips"></div>
  <p class="status" id="status"></p>
  <div id="results"></div>
</main>

<footer>
  <button class="btn small primary" id="btnAdd">+ Add task</button>
  <button class="btn small" id="btnPhoto">Add from photo</button>
  <button class="btn small" id="btnExport">Export JSON</button>
  <button class="btn small" id="btnImport">Import JSON</button>
  <button class="btn small ghost" id="btnReset">Uncheck all</button>
  <button class="btn small ghost" id="btnKey">API key</button>
  <input type="file" id="fileImport" accept="application/json">
  <input type="file" id="filePhoto" accept="image/*" multiple>
</footer>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <label>Task number</label><input name="task" placeholder="21-62-00-810-901" required>
    <label>Title</label><input name="title" placeholder="Control Cabin Too Cold, No Temperature Control in AUTO" required>
    <label>Description / indications</label><textarea name="desc" placeholder="Amber AUTO FAIL light comes on…"></textarea>
    <label>Possible causes — one per line</label><textarea name="causes" placeholder="Pressure Controller Fault, M1653 and M1654&#10;Outflow Valve Fault, V48" required></textarea>
    <label>Circuit breakers — one per line: PANEL ROW COL NUMBER NAME</label><textarea name="cbs" placeholder="P6-4 D 8 C00076 AIR CONDITIONING TEMP IND" style="min-height:70px"></textarea>
    <label>Fault isolation steps — one per line (optional)</label><textarea name="steps" placeholder="Check the left flow control valve is open&#10;Inspect ducts for leaks or blockage…" style="min-height:70px"></textarea>
    <label>Repair confirmation — one per line (optional)</label><textarea name="confirm" placeholder="L PACK switch ON&#10;Check airflow from all outlets" style="min-height:60px"></textarea>
    <label>Effectivity</label><input name="eff" value="DAL ALL 701-777, 801-999">
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn small ghost" value="cancel" type="button" id="dlgCancel">Cancel</button><button class="btn small primary" value="ok">Save</button></div>
  </form>
</dialog>

<script>
/* ---------- seed data (from photographed FIM pages) ---------- */
const SEED=[
 {id:'21-31-00-810-827',task:'21-31-00-810-827',title:'AUTO FAIL Light On - Fault Isolation',ata:'21-31',
  eff:'DAL ALL 701-777, 801-999',
  desc:'Indications that one channel is not serviceable when the system is in the automatic mode:\n(a) The amber AUTO FAIL light comes on\n(b) The MASTER CAUTION and AIR COND lights come on\n(c) The green ALTN light comes on.',
  causes:['Pressure Controller Fault, M1653 and M1654','Outflow Valve Fault, V48','Cabin Pressure Selector Panel Fault, P5-6','Wiring','Aircraft Operation Beyond DCPC Limits Parameters'],
  cbs:[{"panel": "P6-4", "row": "F", "col": "1", "num": "C01273", "name": "PRESSURIZATION CONTROL LCD LTG"}, {"panel": "P6-4", "row": "F", "col": "3", "num": "C01270", "name": "PRESSURIZATION CONTROL AUTO 1"}, {"panel": "P6-4", "row": "F", "col": "5", "num": "C01271", "name": "PRESSURIZATION CONTROL AUTO 2"}, {"panel": "P6-4", "row": "F", "col": "7", "num": "C01272", "name": "PRESSURIZATION CONTROL IND"}],confirm:["Cycle the Pressurization Mode Selector to MAN and back to AUTO. Some AUTO FAIL faults are recoverable: if the light stays out in AUTO, the fault is cleared and the controller is working normally \u2014 go to Repair Confirmation.", "Check the breakers listed above are all closed. If one is open, find out why it tripped before you reset it (AMM 20-60-01-860-801).", "Look at the display window on each cabin pressure controller. If it shows FAULT, run the DCPC BITE (21-31 TASK 801).", "Write down the BCM fault numbers from the controller BITE, then match them to the right procedure below (all of these will cause an AUTO FAIL light).", "Fault 19, 24 and 25 together in IBIT, 032\u2013052, 56, 57, 59\u201361, 91, 108\u2013110 (CPC P/N 7121-19971-01XX) or 19/24/25 together in IBIT, 33\u201335, 37\u201345, 47\u201350, 52, 56, 57, 59\u201361, 108\u2013110 (CPC P/N 21933-01XX) = controller problem \u2192 CONTRL LRU FAIL procedure.", "Fault 7, 9, 10, 11, 019, 064\u2013069, 072\u2013080, 083, 087, 088, 091, 092 (P/N 7121-19971-01XX) or 7, 9, 10, 11, 15, 19, 64, 65, 68, 69, 72\u201380, 83, 87, 88, 92 (P/N 21933-01XX) = aft outflow valve \u2192 OFV LRU FAIL procedure.", "Fault 107 = pressure control panel \u2192 SEL PNL LRU FAIL procedure.", "Fault 15 or 74 = outflow valve or its wiring to the controller \u2192 OFV OR WIRING procedure.", "Fault 1, 2, 6, 13, 14, 15, 110 (P/N 7121-19971-01XX) or 1, 2, 6, 13, 14, 15, 108, 110 (P/N 21933-01XX) = system wire runs \u2192 SYSTEM WIRING procedure.", "Fault 3 = HI CAB ALT procedure. Fault 4 = CAB DIFF PRESS HI procedure. Fault 5 = CAB RATE HI procedure. Fault 109 = DRV ENBL ERROR procedure.", "Fault 024 and 025 together during IBIT only = DADC #1 and DADC #2 \u2192 do both DADC INVALID procedures."],confirmLabel:'Initial evaluation & fault number lookup',steps:["CONTRL LRU FAIL \u2192 do Cabin Pressure Controller Fail, 21-31 TASK 824, then Repair Confirmation.", "OFV LRU FAIL \u2192 do Cabin Pressure Outflow Valve Fail, 21-31 TASK 802, then Repair Confirmation.", "SEL PNL LRU FAIL \u2192 do Cabin Pressure Control Module Display Faults, 21-31 TASK 803, then Repair Confirmation.", "SYSTEM WIRING \u2192 do System Wiring Failure, 21-31 TASK 804, then Repair Confirmation.", "HI CAB ALT \u2192 do Hi Cabin Altitude, 21-31 TASK 817, then Repair Confirmation.", "CAB RATE HI \u2192 do Hi Cabin Altitude Rate Change, 21-31 TASK 818, then Repair Confirmation.", "CAB DIFF PRESS HI \u2192 do Hi Cabin Differential Pressure, 21-31 TASK 816, then Repair Confirmation.", "DRV ENBL ERROR \u2192 do Drive Enable Signal Problem, 21-31 TASK 819, then Repair Confirmation.", "OFV OR WIRING \u2192 do Cabin Pressure Outflow Valve or Wiring, 21-31 TASK 805, then Repair Confirmation.", "DADC #1 INVALID \u2192 do Air Data Inertial Reference Unit 1 Input Problem, 21-31 TASK 806. DADC #2 INVALID \u2192 ADIRU 2 Input Problem, 21-31 TASK 807. Then Repair Confirmation.", "Repair Confirmation: run the DCPC BITE if not already done (21-31 TASK 801). Fixed = no maintenance messages or fault codes AND the AUTO FAIL light is off. Otherwise continue at the next step."],keywords:'pressurization cabin altitude auto fail altn air cond master caution dcpc bcm fault number contrl lru ofv sel pnl system wiring dadc invalid WDM 21-31-22 21-31-23'},
 {id:'21-22-00-810-802',task:'21-22-00-810-802',title:'Low Conditioned Air Flow to the Flight Deck - Fault Isolation',ata:'21-22',
  eff:'DAL ALL 701-777, 801-999',
  desc:'The flow of conditioned air from the flight deck conditioned air outlets is low and seems to be decreasing with continued use.\nFirst check: run the left pack (AMM 21-00-00-800-803, L PACK switch ON on P5), open/operate the flight deck outlets. If airflow is fine it was an intermittent fault; if it is poor from all outlets, do the Fault Isolation steps.',
  causes:['Disconnected, crushed or leaking flight deck distribution duct','Defective muffler/duct assembly - collapsed lining material in the muffler','Duct assembly with blocked wire mesh screen (NOTE: this duct assembly is roughly shaped like a "Y")','Left Standby Temperature Control Valve, V140','Right Standby Temperature Control Valve, V142'],
  steps:["Make sure conditioned air is getting to the flight deck: check the left flow control and shutoff valve is open.", "Check the air distribution ducts between the mix manifold outlet and the flight deck outlets for leaks, damage, icing or blockage (ducts run along the left side of the forward cargo compartment and the E/E bay).", "If you find leaks, damage, icing or a blockage: repair the duct. If the blockage is at the muffler/duct assembly in the mix bay, replace it (AMM 21-22-05-000-801 / 400-801). Then do the Repair Confirmation.", "Clean the flight deck duct assembly screen (AMM 21-22-07-100-801). Muffler debris builds up on the wire mesh screen inside the \"Y\" duct and cuts airflow. Then do the Repair Confirmation.", "Replace the Left Standby Temperature Control Valve, V140 (AMM 21-51-11-000-801 / 400-801). Then do the Repair Confirmation.", "Replace the Right Standby Temperature Control Valve, V142 (AMM 21-51-11-000-801 / 400-801). Then do the Repair Confirmation."],confirm:["If conditioned air is not being supplied to the flight deck, supply it with a cooling pack (AMM 21-00-00-800-803).", "Make sure the L PACK switch on the P5-10 air conditioning panel is ON.", "Check for good airflow from: overhead outlets and gasper, underseat diffusers, foot air diffusers, windshield air diffusers, sidewall outlets (shoulder warmers), individual panel gaspers.", "Good airflow from all outlets = problem fixed. Not satisfactory = continue the Fault Isolation at the next step."],cbs:'',keywords:'cockpit airflow weak vent gasper distribution SDS 21-22-00'},
 {id:'21-62-00-810-901',task:'21-62-00-810-901',title:'Control Cabin Too Cold, No Temperature Control in AUTO - Fault Isolation',ata:'21-62',
  eff:'DAL ALL 701-777, 801-999',
  desc:'The Control Cabin Temperature is too cold with the CONT CAB Temperature Selector in the AUTO range.\nOn the P5-17 Temperature Control Panel, you can put the AIR TEMP Selector to CONT CAB to observe the duct temperature for the Control Cabin.',
  causes:['Control Cabin Duct Primary Temperature Sensor, T478','Control Cabin Duct Backup Temperature Sensor, T477','Control Cabin Temperature Sensor Module, M1718','Pack Flow Control and Shutoff Valve, V18','Trim Air PRSOV, V146','Left Pack Temperature Sensor, T471','Left Air Conditioning Accessory Unit (ACAU), M324','Wiring'],
  cbs:'',keywords:'cockpit flight deck cold temp temperature cont cab auto P5-17 trim air pack'},
 {id:'21-45-00-810-802',task:'21-45-00-810-802',title:'Emergency Exit Door Area Too Cold - Fault Isolation',ata:'21-45',
  eff:'DAL ALL 701-777, 801-999',
  desc:'The area around the emergency exit door (EED) is too cold when the airplane is in flight.\nNOTE: The emergency exit door will be referred to as the EED during this procedure.\n(2) SDS SUBJECT 21-45-00',
  causes:['Left AFT Overwing Door Lining Heater, M2176 (FWD) or M2204 (AFT)','Right AFT Overwing Door Lining Heater, M2174 (FWD) or M2201 (AFT)','Left AFT Overwing Door Trim Heater, M2205 (FWD) or M2206 (AFT)','Right AFT Overwing Door Trim Heater, M2202 (FWD) or M2203 (AFT)','Left FWD Overwing Door Lining Heater, M2182 (FWD) or M2213 (AFT)','Right FWD Overwing Door Lining Heater, M2178 (FWD) or M2207 (AFT)','Left FWD Overwing Door Trim Heater, M2214 (FWD) or M2215 (AFT)','Right FWD Overwing Door Trim Heater, M2208 (FWD) or M2209 (AFT)','Left FWD Closeout Panel Heater, M2183','Right FWD Closeout Panel Heater, M2179','Left AFT Closeout Panel Heater, M2177','Right AFT Closeout Panel Heater, M2175','Door Area Heater Power Relay, R560','SYS 1 AIR/GND Relay, R593','Wiring'],
  cbs:[{"panel":"P18-3","row":"E","col":"11","num":"C01274","name":"AIR CONDITIONING DOOR AREA HEAT CONT"},{"panel":"P91","row":"A","col":"14","num":"C01279","name":"DOOR AREA HTR-AFT (DAL 701-771)"},{"panel":"P91","row":"A","col":"16","num":"C01280","name":"DOOR AREA HTR-FWD (DAL 701-771)"},{"panel":"P91","row":"D","col":"7","num":"C01279","name":"DOOR AREA HTR-AFT (DAL 772-777, 801-999)"},{"panel":"P91","row":"D","col":"9","num":"C01280","name":"DOOR AREA HTR-FWD (DAL 772-777, 801-999)"}],confirm:["Do the Door Area Heater Operational Test (AMM 21-45-00-700-802). If the forward door area heater is dead, fix that first (21-45 TASK 801) \u2014 the EED heaters share its power source and wire bundle.", "Both door area heaters work? Test each EED heater and its wiring with the Emergency Exit Hatch Heaters Operational Test (AMM 21-45-00-700-801). Five heaters per door. One heater dead = steps 1\u20134 (single heater: heater or wiring).", "Both door area heaters dead = steps 5\u20139 (all EED heaters: R560 relay, R593 air/gnd relay, or wiring)."],confirmLabel:'Initial evaluation',steps:["ONE HEATER: EED Trim heater dead (M2202, M2203, M2205, M2206, M2208, M2209, M2214, M2215) = replace it (AMM 21-45-02-000-802 / 400-802). Confirm.", "ONE HEATER: EED Lining heater dead (M2201, M2204, M2207, M2213, M2174, M2176, M2178, M2182) = replace it (AMM 25-21-20-000-801 / 400-801). Confirm.", "ONE HEATER: EED Closeout Panel heater dead (M2177, M2179, M2175, M2183) = replace it (AMM 21-45-02-000-803 / 400-803). Confirm.", "ONE HEATER wiring: get access (blanket removal 21-45-02-000-801/802/803). Check continuity from R560 connector D10882 to the heater connector pin 1 \u2014 RIGHT side heaters use D10882 pin B1: M2174\u2192D12544, M2175\u2192WHT/BLU, M2178\u2192D12560, M2179\u2192WHT/BLU, M2201\u2192D12652, M2202\u2192D12656, M2203\u2192D12660, M2207\u2192D12676, M2208\u2192D12680, M2209\u2192D12684. LEFT side use D10882 pin A1: M2176\u2192D12552, M2177\u2192WHT/BLU, M2182\u2192D12576, M2183\u2192WHT/BLU, M2204\u2192D12664, M2205\u2192D12668, M2206\u2192D12672, M2213\u2192D12700, M2214\u2192D12704, M2215\u2192D12708. Make sure the other heater pin has continuity to ground. Repair, reinstall blankets (400-801/802/803), confirm.", "ALL HEATERS: replace the Door Area Heater Power Relay, R560 (P91 panel, E/E compartment). Confirm.", "ALL HEATERS: replace the SYS 1 AIR/GND relay, R593. Confirm.", "ALL HEATERS wiring (WDM 21-42-11): pull D10882 off R560. Check continuity from breaker C1274 (P18-3 AIR CONDITIONING DOOR AREA HEAT CONTROL) load terminal to D10882 pin X1. Repair, reconnect, confirm.", "ALL HEATERS wiring: pull D11020 off R593. Check continuity R560 D10882 pin X2 to R593 D11020 pin A2. Repair, reconnect, confirm.", "ALL HEATERS wiring: with D11020 still off R593, check continuity R593 D11020 pin A1 to the flow control valve \u2014 left pack V18 connector D486 pin 2, right pack V19 connector D490 pin 2. (If there is an isolation diode in the run, put the + lead on the anode side and \u2212 lead on the cathode side \u2014 the stripe end.) Repair, reconnect D11020, confirm.", "REPAIR CONFIRMATION: Door Area Heater Operational Test (AMM 21-45-00-700-802) and Emergency Exit Hatch Heaters Operational Test (AMM 21-45-00-700-801). Heaters work = fixed; if not, go to the next step."],keywords:'overwing exit EED cold heater lining trim closeout cabin R560 R593 D10882 D11020 C1274 C01274 C01279 C01280 P18-3 P91 V18 V19 D486 D490 SSM WDM 21-42-11'},
 {id:'21-45-00-810-801',task:'21-45-00-810-801',title:'Door Area Heater Does Not Operate - Fault Isolation',ata:'21-45',
  eff:'DAL ALL 701-777, 801-999',
  desc:'One of the door area heaters does not operate as expected.\n(2) SDS SUBJECT 21-45-00',
  causes:["Door area heater, M1708 (forward) or M1681 (aft)", "Door area heater, M2637 (mid) \u2014 DAL 801-999 only", "Mid door heater blankets: L mid door surround, M2633 or M2634 \u2014 PRE SB 737-52-1190 airplanes", "Door area heater power relay, R560 (mid: R982)", "Wiring", "Sys 1 air/gnd relay, R593"],
  cbs:[{"panel": "P18-3", "row": "E", "col": "11", "num": "C01274", "name": "AIR CONDITIONING DOOR AREA HEAT CONT"}, {"panel": "P6-12", "row": "D", "col": "5", "num": "C01675", "name": "MID EXIT DOOR AREA HEATER (DAL 801-999)"}, {"panel": "P91", "row": "A", "col": "14", "num": "C01279", "name": "DOOR AREA HTR-AFT (DAL 701-771)"}, {"panel": "P91", "row": "A", "col": "16", "num": "C01280", "name": "DOOR AREA HTR-FWD (DAL 701-771)"}, {"panel": "P91", "row": "D", "col": "7", "num": "C01279", "name": "DOOR AREA HTR-AFT (DAL 772-777, 801-999)"}, {"panel": "P91", "row": "D", "col": "9", "num": "C01280", "name": "DOOR AREA HTR-FWD (DAL 772-777, 801-999)"}],confirm:["DAL 701-777 with a CAB/UTIL switch on P5-13: make sure it is ON.", "Do the Door Area Heater Operational Test (AMM 21-45-00-700-802).", "Test good = intermittent fault, you are done.", "One heater fails = use steps 1\u20134 below (One heater). Both fail = use steps 5\u20138 (Both heaters). Mid door heater (931-999 PRE SB 737-52-1190) = steps 9\u201311."],confirmLabel:'Initial evaluation',steps:["ONE HEATER: replace the bad door area heater, M1708 (fwd) or M1681 (aft). Test. Not fixed = continue.", "ONE HEATER: replace the door area heater power relay, R560. Test. Not fixed = continue.", "ONE HEATER wiring, FWD (M1708): run a pack (AMM 21-00-00-800-803), put the airplane in air mode (AMM 32-09-00-860-801), pull R560. Check 200 VAC phase-to-phase on D10882 pin A2 to B2. Then continuity from D10882 (P91 panel) to D10884 on the heater: A1 \u2192 pin 1, B1 \u2192 pin 3.", "ONE HEATER wiring, AFT (M1681): same setup, pull R560. Check 200 VAC on D10882 pin C2 to D2. Continuity D10882 to D10770 on the heater: C1 \u2192 pin 2, C1 \u2192 pin 3, D1 \u2192 pin 1. Repair wiring, reinstall R560, reconnect D10884 / D10770, test.", "BOTH HEATERS: replace the door area heater power relay, R560. Test. Not fixed = continue.", "BOTH HEATERS wiring: run a pack, put the airplane in air mode, pull R560. Check 28 VDC on D10882 pin X1 to structure ground. No 28 VDC = repair the wiring from X1 back to breaker C1274 AIR CONDITIONING DOOR AREA HEAT CONT, reinstall R560, test.", "BOTH HEATERS: 28 VDC present = check continuity from D10882 pin X2 to structure ground. No continuity = replace SYS 1 AIR/GND relay R593, reinstall R560, test. Still bad = repair the wiring from X2 to terminal block TB22Y.", "BOTH HEATERS: continuity was good = reinstall R560 and test.", "MID DOOR (931-999 PRE SB 737-52-1190): mid heater bad but mid door heater blankets OK = replace the door area heater, M2637. Test. Not fixed = continue.", "MID DOOR: heater and blankets both bad = replace the door area heater power relay, R982. Test. Not fixed = continue.", "MID DOOR wiring: run a pack, air mode, pull R982. Check 200 VAC on D14064 pin A2 to B2. Continuity D14064 (J39 panel) to D14098 on the mid heater: A1 \u2192 pin 1, B1 \u2192 pin 3, B1 \u2192 pin 2. Repair, reinstall R982, reconnect, test.", "REPAIR CONFIRMATION (every step above): Door Area Heater Operational Test, AMM 21-45-00-700-802. Test good = fixed."],keywords:'entry door heater inop forward aft mid galley blanket R560 R982 R593 D10882 D10884 D10770 D14064 D14098 C1274 TB22Y CAB/UTIL SSM 21-42-11 WDM 21-42-11'},
 {id:'21-31-00-810-822',task:'21-31-00-810-822',title:'Wheels On Ground Disagreement Problem - Fault Isolation',ata:'21-31',
  eff:'DAL ALL 701-777, 801-999',
  desc:'This task is for this maintenance message:\n(a) LDG GEAR DISAGREE',
  causes:['Proximity switch electronics unit (PSEU), M2061','Wiring'],
  cbs:[{"panel": "P6-4", "row": "F", "col": "1", "num": "C01273", "name": "PRESSURIZATION CONTROL LCD LTG"}, {"panel": "P6-4", "row": "F", "col": "3", "num": "C01270", "name": "PRESSURIZATION CONTROL AUTO 1"}, {"panel": "P6-4", "row": "F", "col": "5", "num": "C01271", "name": "PRESSURIZATION CONTROL AUTO 2"}, {"panel": "P6-4", "row": "F", "col": "6", "num": "C01269", "name": "PRESSURIZATION CONTROL MANUAL"}, {"panel": "P6-4", "row": "F", "col": "7", "num": "C01272", "name": "PRESSURIZATION CONTROL IND"}],steps:["Run the PSEU BITE (32-09 TASK 801). If it shows any maintenance messages, do the corrective action for that message, then run the DCPC BITE (21-31 TASK 801): message gone = fixed.", "No PSEU messages? Check the wiring between cabin pressure controllers 1 and 2 and the PSEU: remove CPC 1 and 2 (AMM 21-31-01-000-801) and open the Forward Access Door, 112A.", "Wiring check \u2014 CPC 1 connector D10738B: pin B1 to D11138 pin 12, and pin B4 to D10988 pin 12. CPC 2 connector D10740B: pin B1 to D11138 pin 12, and pin B4 to D10988 pin 12. Repair any wiring problem you find.", "Close 112A, reinstall the cabin pressure controllers (AMM 21-31-01-400-801), run the DCPC BITE. Message gone = fixed. Close the Electronic Equipment Access Door, 117A."],confirm:["Run the DCPC BITE (21-31 TASK 801).", "No maintenance message = intermittent fault, you are done.", "Message shows = work the Fault isolation steps above."],confirmLabel:'Initial evaluation',keywords:'ldg gear disagree air ground wow pressurization pseu wiring D10738B D10740B D11138 D10988 112A 117A SSM 21-31-24'},
 {id:'21-31-00-810-817',task:'21-31-00-810-817',title:'Hi Cabin Altitude - Fault Isolation',ata:'21-31',
  eff:'DAL ALL 701-777, 801-999',
  desc:'This task is for this maintenance message:\n(a) HI CAB ALT',
  causes:['Cabin pressure outflow valve, V48','Cabin pressure controller, M1653 (No. 1) or M1654 (No. 2)'],
  cbs:[{"panel": "P6-4", "row": "F", "col": "1", "num": "C01273", "name": "PRESSURIZATION CONTROL LCD LTG"}, {"panel": "P6-4", "row": "F", "col": "3", "num": "C01270", "name": "PRESSURIZATION CONTROL AUTO 1"}, {"panel": "P6-4", "row": "F", "col": "5", "num": "C01271", "name": "PRESSURIZATION CONTROL AUTO 2"}, {"panel": "P6-4", "row": "F", "col": "6", "num": "C01269", "name": "PRESSURIZATION CONTROL MANUAL"}, {"panel": "P6-4", "row": "F", "col": "7", "num": "C01272", "name": "PRESSURIZATION CONTROL IND"}],steps:["Replace the cabin pressure outflow valve (AMM 21-31-03-000-801 / 400-801). Run the DCPC BITE (21-31 TASK 801): message gone = fixed; still shows = continue.", "Replace the cabin pressure controller that has the maintenance message (AMM 21-31-01-000-801 / 400-801). Run the DCPC BITE again: message gone = fixed."],confirm:["Before you start (CPC P/N 7121-19971-01AA / 01AB / 01AC / 01BA): check the copper tape on the outside edges of the cabin pressure controller \u2014 1.5 to 2.2 mm onto the front outer edges, no cracks, holes or dents, smoothly attached, no openings where the front cover meets the sides. If any of that is wrong, replace the controller (AMM 21-31-01-000-801 / 400-801).", "Run the DCPC BITE (21-31 TASK 801).", "No maintenance messages = intermittent fault, you are done.", "If the DCPC shows Fault Code 30 in the history, or pilots report cabin altitude above schedule in cruise or cabin altitude climbing in cruise/initial descent: do the Engine Bleed Air System Health Check (AMM 36-11-00-700-801), the Airplane Pack Operation Confidence Check (AMM 21-00-05-780-801), then the DCPC BITE again.", "Message shows plus another message = do the Fault Isolation for the other message first.", "Message shows and it is the only one = work the Fault isolation steps above."],confirmLabel:'Initial evaluation',keywords:'hi cab alt cabin altitude high pressurization outflow bleed health check fault code 30 SSM 21-31-22 21-31-23'},
 {id:'21-31-00-810-816',task:'21-31-00-810-816',title:'Hi Cabin Differential Pressure - Fault Isolation',ata:'21-31',
  eff:'DAL ALL 701-777, 801-999',
  desc:'This task is for this maintenance message:\n(a) CAB DIFF PRESS HI',
  causes:['Cabin pressure outflow valve, V48','Cabin pressure controller, M1653 (No. 1) or M1654 (No. 2)','Cabin altitude and differential pressure indicator (located on P5-16 panel)','Flight altitude exceeded FLT ALT window setting'],
  steps:["Replace the cabin pressure outflow valve (AMM 21-31-03-000-801 / 400-801). Then run the DCPC BITE (21-31 TASK 801): message gone = fixed; message still shows = continue.", "Replace the cabin pressure controller that has the maintenance message (AMM 21-31-01-000-801 / 400-801). Run the DCPC BITE again: message gone = fixed; still shows = continue.", "Replace the cabin altitude and differential pressure indicator (AMM 21-33-02-000-801 / 400-801). Run the DCPC BITE: message gone = fixed. If it still shows, do the Alternate Static System Low-range Leak Test (AMM 34-11-00-790-808) and correct any problems you find.", "Check that the airplane did not exceed the altitude set in the FLT ALT window: find the flight leg when the message occurred and do the controller download. If flight altitude was above the FLT ALT setting, no further action is required."],confirm:["Before you start (CPC P/N 7121-19971-01AA / 01AB / 01AC / 01BA): look at the copper tape on the outside edges of the cabin pressure controller. It should extend 1.5 to 2.2 mm onto the front outer edges, with no cracks, holes or dents, smoothly attached to the face, and no openings where the front cover meets the sides. If any of that is wrong, replace the controller (AMM 21-31-01-000-801 / 400-801).", "Run the DCPC BITE (21-31 TASK 801).", "No maintenance messages = it was an intermittent fault, you are done.", "Message shows plus another message = do the Fault Isolation for the other message first.", "Message shows and it is the only one = work the Fault isolation steps above."],confirmLabel:'Initial evaluation',cbs:[{"panel": "P6-4", "row": "F", "col": "1", "num": "C01273", "name": "PRESSURIZATION CONTROL LCD LTG"}, {"panel": "P6-4", "row": "F", "col": "3", "num": "C01270", "name": "PRESSURIZATION CONTROL AUTO 1"}, {"panel": "P6-4", "row": "F", "col": "5", "num": "C01271", "name": "PRESSURIZATION CONTROL AUTO 2"}, {"panel": "P6-4", "row": "F", "col": "6", "num": "C01269", "name": "PRESSURIZATION CONTROL MANUAL"}, {"panel": "P6-4", "row": "F", "col": "7", "num": "C01272", "name": "PRESSURIZATION CONTROL IND"}],keywords:'cab diff press hi differential pressure high pressurization outflow flt alt'},
 {id:'21-53-00-810-820',task:'21-53-00-810-820',title:'L (R) PACK Light is ON (Without MASTER CAUTION Recall) - Fault Isolation',ata:'21-53',
  eff:'DAL ALL 701-777, 801-999',
  desc:'This task is for these Observed Faults:\n(a) The L PACK Light on the Air Conditioning Module, P5-10, comes ON without MASTER CAUTION Recall.\n(b) The R PACK Light on the Air Conditioning Module, P5-10, comes ON without MASTER CAUTION Recall.\nNOTE: Refer to 21-53 TASK SUPPORT Figure 301 for a Block Diagram of this procedure.\nRelated data: WDM 21-51-15, WDM 21-51-25.',
  causes:['Damaged or missing Left (Right) Fan Bypass Check Valve Door in the Primary Plenum/Diffuser Assembly','Left (Right) Aft (Exhaust, Exit) Smart Ram Air Door Actuator (SRADA), M2796 (M2798) — DAL 775-777, 801-930, 951-999, airplanes with SRADA','Flap Switch, S1051','Left (Right) Ram Air Door Actuator (RADA), M326 (M327) — DAL 701-774, 931-950, airplanes with RADA','Blocked Left (Right) Heat Exchangers','Left (Right) Air Cycle Machine (ACM)','Standby Temperature Control Valve (STCV) Sense Lines','Left (Right) STCV, V140 (V142)','Loss of 28V DC Power to the Air Conditioning Panel, P5-10','Wiring','Left (Right) Compressor Discharge Overheat Switch, S2 (S5)','Left (Right) Pack Discharge Duct Overheat Switch, S934 (S935)','Left (Right) Turbine Inlet Overheat Switch, S938 (S939)'],
  cbs:[{"panel":"P6-4","row":"C","col":"7","num":"C01177","name":"A/C PACK/ENGINE BLEED AIR OVHT RIGHT"},{"panel":"P6-4","row":"C","col":"8","num":"C01176","name":"A/C PACK/ENGINE BLEED AIR OVHT LEFT"}],
  confirmLabel:'Initial evaluation',confirm:["SRADA airplanes (DAL 775-777, 801-930, 951-999): visual check of the gap at the inlet and exit doors \u2014 deflector door deployed and inlet door angle less than 180\u00b0; exit door louver gap 3.8 \u00b10.5 in (9.7 \u00b11.3 cm). Gap wrong = replace the applicable SRADA (Ram Air Exhaust Actuator R&I, AMM 21-51-27-000-801 / 400-801). Gap correct = continue.","Push the TRIP RESET switch on the Air Conditioning Module, P5-10. NOTE: if TRIP RESET does not extinguish the PACK light, there may be a nuisance TCV fault after the BITE procedure.","Do the Pack Temperature Control BITE Procedure (21-62 TASK 801) on the Left and Right temperature controllers. If maintenance messages show, use the table at the end of the BITE procedure to find the FIM tasks, do the corrective actions, then continue below. A Dual Channel Fault (two different messages, one per controller) = do the applicable FIM task; no need to continue here. No messages = continue."],
  steps:["Fan Bypass Check Valve: open 192CL (left) or 192CR (right) ECS access door, then the access panel on the bottom of the primary plenum/diffuser. Make sure the check valve door is installed on the bottom of the primary diffuser and the hinge is not damaged. Damaged or missing = replace the primary plenum/diffuser assembly (AMM 21-51-03-000-805-002 / 400-804-002); make sure the bottom access panel is installed. Satisfactory = continue.","SRADA airplanes (DAL 775-777, 801-930, 951-999): examine the Left (Right) aft (exhaust/exit) SRADA \u2014 Ram Air System SRADA Operational Test (AMM 21-51-00-730-801). Not satisfactory = replace defective components (SRADA linkage, bearings, flap switch S1051). No defective components and exit SRADA not already replaced in the initial evaluation = replace the exit SRADA (AMM 21-51-27-000-801 / 400-801). Continue if nothing replaced.","RADA airplanes (DAL 701-774, 931-950): examine the Left (Right) RADA \u2014 Ram Air System RADA Operational Test (AMM 21-51-00-730-802). Not satisfactory = replace defective components (RADA linkage, bearings, flap switch S1051). Satisfactory = continue.","Clean the Left (Right) heat exchangers \u2014 blowing out debris/blockages with nitrogen/compressed air (AMM 21-51-03-160-811).","Replace the Left (Right) pack ACM (AMM 21-51-04-000-802-002 / 400-802-002). NOTE: on a first occurrence of pack overheat/PACK light without master caution recall, if the ACM passes the inspection criteria in the removal task, the removed ACM can be reinstalled.","STCV sense lines: remove the four sense lines from each end and examine for cracks and blockage. Blockage/unwanted material = remove it, reinstall the lines (light coat of D00006 Pure Nickel Special on threads, STD-1015 torque wrench, 160 \u00b18 in-lb / 18 \u00b11 N\u00b7m), then do the STCV installation test (AMM 21-51-11-400-801). Damage = replace the defective sense line(s), same torque and test. No blockage or damage = replace the Left (Right) STCV (AMM 21-51-11-000-801 / 400-801). NOTE: the STCV step can be skipped if there are no reported temperature control issues in the flight deck or cabin \u2014 an STCV causing pack overheat would also cause inability to cool.","28V DC check at the P5-10 Air Conditioning Panel (WDM 21-51-15 / 21-51-25): L PACK light = pin 29 of connector D646; R PACK = pin 25 of D680. No 28V DC = check wiring L: ACAU 1 (M324) D458B pin 36 to P5-10 D646 pin 29; R: ACAU 2 D10002B pin 36 to P5-10 D680 pin 25. Repair what you find. 28V DC present = continue.","Replace the overheat switches: Left (Right) Compressor Discharge Overheat Switch S2 (S5) \u2014 AMM 21-51-40-000-801 / 400-801; Left (Right) Pack Discharge Duct Overheat Switch S934 (S935) \u2014 AMM 21-51-42-000-803-002 / 400-803-002; Left (Right) Turbine Inlet Overheat Switch S938 (S939) \u2014 AMM 21-51-41-000-801 / 400-801."],
  keywords:'pack light trip off overheat acm heat exchanger srada rada air cond C01176 C01177 P6-4 WDM 21-51-15 21-51-25 192CL 192CR fan bypass check valve diffuser STCV sense lines V140 V142 S2 S5 S934 S935 S938 S939 D646 D680 D458B D10002B M324 ACAU trip reset BITE'},
 {id:'21-51-00-810-803',task:'21-51-00-810-803',title:'RAM DOOR FULL OPEN Light Stays ON During Flight - Fault Isolation',ata:'21-51',
  eff:'DAL ALL 701-777, 801-999',
  desc:'The RAM DOOR FULL OPEN Light on the P5-10 Air Conditioning Panel should go OFF when the airplane is in the air with the Trailing Edge Flaps fully retracted. This is an Advisory Light. There are two lights, one for the Left and one for the Right Ram Air Inlet Modulation Doors.\nDirty heat exchangers or material blocking airflow can keep the modulation doors from closing (ram air control temperature sensor above 230°F). On SRADA airplanes (DAL 775-777, 801-930, 951-999) ram air exit louvers that do not open can also hold the light ON; the SRADAs have a green NO LRU FAULT light and three red LRU lights (BIT with power and valid WOW).\nRelated data: WDM 21-51-14, WDM 21-51-24.',
  causes:['Ram Air Actuators (DAL 775-777, 801-930, 951-999): Left Forward M2795, Right Forward M2797, Left Aft M2796, Right Aft M2798','Dirty Heat Exchangers or Blocked Airflow to Heat Exchangers','Left (Right) Air Conditioning Accessory Unit (ACAU), M324 (M1455)','Left Trailing Edge Flaps UP Switch, S1051','Flap/Slat Electronics Unit (FSEU), M1746','Left (Right) Ram Air Sensor, T481 (T482)','Left (Right) Pack Zone Temperature Controller (PZTC), M1442 (M1443)','Fan Bypass Check Valve','Air Cycle Machine (ACM)','Wiring'],
  cbs:[{"panel":"P6-3","row":"E","col":"11","num":"C00313","name":"INDICATOR MASTER DIM SECT 1"},{"panel":"P6-4","row":"A","col":"4","num":"C00399","name":"AIR CONDITIONING RAM AIR MOD LEFT (DAL 701-774, 931-950)"},{"panel":"P6-4","row":"A","col":"4","num":"C01950","name":"AIR CONDITIONING RAM AIR MOD LEFT (DAL 775-777, 801-930, 951-999)"},{"panel":"P6-4","row":"A","col":"8","num":"C00555","name":"AIR CONDITIONING RAM AIR MOD CONT L"},{"panel":"P6-4","row":"B","col":"4","num":"C00400","name":"AIR CONDITIONING RAM AIR MOD RIGHT (DAL 701-774, 931-950)"},{"panel":"P6-4","row":"B","col":"4","num":"C01951","name":"AIR CONDITIONING RAM AIR MOD RIGHT (DAL 775-777, 801-930, 951-999)"},{"panel":"P6-4","row":"B","col":"8","num":"C01178","name":"AIR CONDITIONING RAM AIR MOD CONT R"}],
  confirmLabel:'Initial evaluation',confirm:["Do the Pack Temperature Control BITE Procedure (21-62 TASK 801). Make sure the Left and Right Ram Air Systems do not show failures.","SRADA airplanes (DAL 775-777, 801-930, 951-999): open the applicable Pack Ram Air Inlet Actuator Panels \u2014 191FL/191FR (fwd wing-to-body fairing, mid fairing above ram air inlet) and 191GL/191GR (ram air actuator panel, forward). Make sure no SRADA red fault indicator lights are ON; if one is ON, replace the associated SRADA or Ram Air Sensor.","Make sure the Left and Right blue RAM DOOR FULL OPEN lights are ON and the Ram Air Inlet Deflector Doors are extended.","Extend the trailing edge flaps to FLAPS 1 (AMM 27-51-00-860-803). Put the airplane in AIR mode (AMM 32-09-00-860-801).","Make sure: deflector doors fully retract; modulation panels move toward CLOSED (NOTE: movement can be hard to notice); RAM DOOR FULL OPEN lights stay ON; SRADA airplanes \u2014 ram air exit louvers stay OPEN. If these results do not occur, do \u2018Deflector Door Does Not Retract\u2019 below. If they do, continue.","Retract the flaps to FULLY UP (AMM 27-51-00-860-804). Make sure: modulation panels move toward CLOSED; RAM DOOR FULL OPEN lights go OFF; SRADA \u2014 exit louvers move toward CLOSED. If not, do \u2018Modulation Panels Do Not Move to Cruise Position\u2019. If the light goes OFF, it was an intermittent fault.","If the light does NOT go OFF but the modulation panels did move toward CLOSED, do \u2018Indication Circuit Problem\u2019 below.","Fan Bypass Check Valve check \u2014 Left pack: open 192CL (ECS access door); Right pack: open 192CR (ECS access door) and 192DR (ECS high pressure access door). Remove the access panel on the bottom of the primary plenum/diffuser. Do the Fan Bypass Check Valve Door Operational Check (AMM 21-51-03-710-801). If the door is not installed or does not operate correctly, replace the diffuser assembly with a serviceable unit or replace the check valve door off aircraft per vendor instructions (Allied Signal SB 2215240-21-2721 / -2722). If the door is missing from the bottom of the primary diffuser, replace the bypass door (heat exchanger and plenum/diffuser R&I: AMM 21-51-03-000-805-002 / 400-804-002). Close panels.","If no problem found: open the heat exchanger access panel, remove the heat exchanger inlet duct inspection panel, and examine the ram air duct for unwanted material that can reduce airflow. If found, clean the heat exchangers \u2014 backflush (AMM 21-51-03-160-807), nitrogen/compressed air blow-out (AMM 21-51-03-160-811), or soap-water-air (AMM 21-51-03-160-809)."],
  keywords:'ram door full open light ram air modulation door louver srada heat exchanger flaps advisory C00313 C00399 C00400 C00555 C01178 C01950 C01951 P6-3 P6-4 WDM 21-51-14 21-51-24 191FL 191FR 191GL 191GR 192CL 192CR 192DR fan bypass check valve diffuser BITE'},
 {id:'21-61-00-810-863',task:'21-61-00-810-863',title:'Aft Cabin AUTO Temperature Control Does Not Operate - Fault Isolation',ata:'21-61',
  eff:'DAL ALL 701-777, 801-999',
  desc:'The Aft Cabin Automatic Temperature Control does not operate.\nRelated data: WDM 21-51-12, WDM 21-61-14, SSM 21-51-12, SSM 21-61-14.',
  causes:['Pack/Zone Temperature Control System failure','Trim Air Pressure Regulating and Shutoff Valve (TAPRSOV), V146','Aft Cabin Temperature Sensor Module, M2848 — DAL 774-777, 801-899, 931-957','Aft Cabin Duct Temperature Limit Sensor, T536','Aft Cabin Zone Temperature Sensor Fan, M1446 — DAL 701-773','Aft Cabin Zone Temperature Sensor Filter','Separation of Sidewall Riser Ducts from Transition Duct'],
  cbs:[{panel:'P6-4',row:'A',col:'3',num:'C01170',name:'A/C ZONE TEMP VALVE/FAN CONT AFT PASS'},{panel:'P6-4',row:'A',col:'9',num:'C01158',name:'AIR CONDITIONING PACK CONTROL LEFT DC'},{panel:'P6-4',row:'A',col:'11',num:'C01159',name:'AIR CONDITIONING PACK CONTROL LEFT AC'}],
  confirmLabel:'Initial evaluation',confirm:["Supply conditioned air to the passenger compartment with both packs (AMM 21-00-00-800-803). Make sure the AFT CAB selector on P5-17 is in AUTO.","Examine the passenger cabin sidewall panels on both sides near the floor adjacent to the forward wing-to-body fairing: panels must not look expanded inboard just above floor level and should match the contour of adjacent panels; listen for whistling noises that could indicate leaking ducts. Either condition present = do the fault isolation steps (see step 6).","Let the packs run a few minutes to stabilize, then put AFT CAB to W. Temperature in the aft cabin increases = intermittent fault; remove conditioned air (AMM 21-00-00-800-804). Does not increase = do the fault isolation steps."],
  steps:["BITE test of the left pack/zone temperature controller M1442 (Pack Temperature Control BITE, 21-62 TASK 801). Fault shown = do the corrective action for the message, then both packs on, AFT CAB to AUTO, stabilize, AFT CAB to W \u2014 temperature increases = fixed; remove conditioned air (800-804). No fault = continue.","Replace the TAPRSOV V146 \u2014 AMM 21-62-01-000-801 / 400-801.","TAPRSOV V146 test: close C/Bs on P6-4 \u2014 C00263 (C/5 PACK CONT VALVES R), C00262 (C/6 PACK CONT VALVES L), C01172 (D/9 TRIM AIR PRESS). Supply pneumatic pressure with the APU (AMM 36-00-00-860-803). On P5-10: L and R PACK to AUTO, BLEED 1 and 2 ON, APU BLEED ON. On P5-17: CONT CAB, AFT CAB and FWD CAB selectors midway between C and AUTO, TRIM AIR ON, AIR TEMP selector to AFT CAB SUPPLY DUCT. Run the packs until the aft cabin supply duct indication stops changing; record the supply duct temperature at each of the three SUPPLY DUCT positions (CONT CAB, FWD, AFT). Set AFT CAB to W (full warm) \u2014 the aft passenger cabin supply duct should read at least 10\u00b0F warmer than the forward and control cabin zones. Higher = fixed. Not higher = continue.","Resistance check of the aft cabin duct temperature limit sensor T536 (Duct Temperature Limit Sensor Test, AMM 21-61-04-000-805-002). If you replaced T536 and the fault is gone = fixed. Resistance satisfactory = continue.","Aft cabin zone temperature sensor filter and fan: hold a 3 x 4 in sheet of lightweight paper over the air inlet grille of the sensor assembly. Fan does not hold it = remove the filter (AMM 21-61-06-000-801) and check for dirt/blockage. Dirty = install a new filter (AMM 21-61-06-400-801). Not dirty = replace the aft cabin zone temperature sensor fan (AMM 21-61-11-000-801 / 400-801). Either way, confirm: both packs on, AFT CAB AUTO, stabilize, AFT CAB to W \u2014 temperature increases = fixed; remove conditioned air (800-804). Fan holds the paper = remove conditioned air and continue.","If the initial evaluation showed sidewall panel damage near the floor by the forward wing-to-body fairing: remove the applicable sidewall panel(s) (AMM 25-21-46-000-801), then inspect and repair the sidewall risers \u2014 Sidewall Riser Ducts/Transition Duct Inspection AMM 21-23-02-212-801 and Repair AMM 21-23-02-360-801."],
  keywords:'aft cab auto temp control inop zone temperature trim air M1442 TAPRSOV V146 T536 C00262 C00263 C01172 sensor fan filter BITE W full warm sidewall riser duct wing-to-body fairing whistling SSM 21-61-14'},
 {id:'21-61-00-810-861',task:'21-61-00-810-861',title:'Control Cabin AUTO Temperature Control Does Not Operate - Fault Isolation',ata:'21-61',
  eff:'DAL ALL 701-777, 801-999',
  desc:'The control cabin automatic temperature control does not operate.\nInitial evaluation: supply conditioned air to the control cabin with both packs.\nRelated data: WDM 21-61-11, WDM 21-61-12, SSM 21-61-11, SSM 21-61-12.',
  causes:['Trim Air PRSOV, V146','Control Cabin Zone Temperature Sensor Filter','Control Cabin Zone Temperature Sensor Fan, M1718','Control Cabin Duct Temperature Sensor (CCDTS), T478','Zone Temperature Controller (ZTC) No. 2, M1443 — DAL 701-777, 801-852, 931-999','R Pack Temperature Controller (PTC), M2952 — DAL 853-930'],
  cbs:[{panel:'P6-4',row:'B',col:'3',num:'C01163',name:'A/C ZONE TEMP VALVE/FAN CONT FLT DECK'},{panel:'P6-4',row:'B',col:'4',num:'C00400',name:'AIR CONDITIONING RAM AIR MOD RIGHT (DAL 701-774, 931-950)'},{panel:'P6-4',row:'B',col:'9',num:'C01161',name:'AIR CONDITIONING PACK CONT RIGHT DC'},{panel:'P6-4',row:'B',col:'11',num:'C01162',name:'AIR CONDITIONING PACK CONT RIGHT AC'},{panel:'P6-4',row:'D',col:'9',num:'C01172',name:'AIR CONDITIONING TRIM AIR PRESS'}],
  confirmLabel:'Initial evaluation',confirm:["Supply conditioned air to the control cabin with both packs (AMM 21-00-00-800-803). Make sure the CONT CABIN selector on P5-17 is in AUTO. Let the packs run a few minutes to stabilize.","Put the CONT CABIN selector to W. Temperature in the control cabin does not increase = do the fault isolation steps. Temperature increases = intermittent fault; remove conditioned air (AMM 21-00-00-800-804)."],
  steps:["BITE test of the right pack/zone temperature controller M1443 (Pack Temperature Control BITE, 21-62 TASK 801). Fault shown = do the corrective action for the message, then supply conditioned air with both packs, CONT CABIN to AUTO, stabilize, CONT CABIN to W \u2014 temperature increases = fixed; remove conditioned air (800-804). No fault = continue.","Replace the trim air pressure regulating and shutoff valve (PRSOV) V146 \u2014 AMM 21-62-01-000-801 / 400-801.","PRSOV test: close C/Bs on P6-4 \u2014 C00263 (C/5 PACK CONT VALVES R), C00262 (C/6 PACK CONT VALVES L), C01172 (D/9 TRIM AIR PRESS). Supply pneumatic pressure with the APU (AMM 36-00-00-860-803). On P5-10: L and R PACK to AUTO, BLEED 1 and 2 ON, APU BLEED ON. On P5-17: FWD CABIN, AFT CABIN and CONT CABIN selectors midway between C and AUTO, TRIM AIR ON, AIR TEMP selector to CONT CABIN SUPPLY DUCT. Run the packs until the cont cab supply duct indication stops changing; record the supply duct temperature at each of the three SUPPLY DUCT positions (CONT CABIN, FWD, AFT). Set CONT CABIN to W (full warm) \u2014 the control cabin supply duct should read at least 10\u00b0F (-12\u00b0C) warmer than the fwd and aft zones. Higher = fixed. Not higher = continue.","Control cabin zone temperature sensor filter and fan: hold a 3 x 4 in sheet of lightweight paper over the air inlet grille of the sensor assembly. Fan does not hold it = remove the filter (AMM 21-61-06-000-801) and check for dirt/blockage. Dirty = install a new filter (AMM 21-61-06-400-801). Not dirty = replace the control cabin zone temperature sensor fan (AMM 21-61-11-000-801 / 400-801). Either way, confirm: both packs on, CONT CABIN AUTO, stabilize, CONT CABIN to W \u2014 temperature increases = fixed; remove conditioned air (800-804).","Wiring check (WDM 21-61-11 / 21-61-12). DAL 701-777, 801-852, 931-999: disconnect D3860A from ZTC No. 2 (M1443) and measure resistance D3860A pin A5 to pin B5; disconnect D3858A from ZTC No. 1 (M1442) and measure D3858A pin A5 to pin B5. DAL 853-930: disconnect D15816B from the R PTC (M2952) and measure pin E9 to E10; disconnect D15814B from the L PTC (M2951) and measure pin E9 to E10. Compare the two values \u2014 they are the CCDTS Primary T478 and CCDTS Backup T477. Different = replace the CCDTS Primary T478 (Duct Temperature Limit Sensor, AMM 21-61-04-000-803-002 / 400-803-002). Same = replace the controller: ZTC No. 2 M1443 (AMM 21-61-20-000-801 / 400-801) on 701-777, 801-852, 931-999; R PTC M2952 (AMM 21-61-17-000-801 / 400-801) on 853-930."],
  keywords:'cont cab flight deck cockpit auto temp control inop zone temperature ztc M1442 M1443 M2951 M2952 PTC PRSOV V146 T477 T478 CCDTS D3858A D3860A D15814B D15816B C00262 C00263 C01172 sensor fan filter BITE trim air W full warm WDM 21-61-11 21-61-12'},
 {id:'21-61-00-810-860',task:'21-61-00-810-860',title:'Aft Passenger Cabin Supply Duct Temperature Indication Problem - Fault Isolation',ata:'21-61',
  eff:'DAL ALL 701-777, 801-999',
  desc:'There is a problem with the AFT SUPPLY DUCT air temperature indication shown on the P5-17 cabin temperature panel.\nNOTE: The temperature bulb is for indication only; a defective bulb or wiring will not affect the temperature control system. There is no on-wing check of the temperature bulb.\nRelated data: SSM 21-61-51, WDM 21-61-51.',
  causes:['Air temperature indicator, N11','Aft cabin supply duct temperature bulb, T535','Air temperature selector, S1','Wiring'],
  cbs:[{panel:'P6-4',row:'D',col:'8',num:'C00076',name:'AIR CONDITIONING TEMP IND'}],
  confirmLabel:'Initial evaluation',confirm:["Supply conditioned air with the RIGHT pack (AMM 21-00-00-800-803). On P5-17 put CONT CAB, FWD CAB and AFT CAB selectors to AUTO (12:00). Run the pack 2 minutes to stabilize.","Use a STD-1122 thermometer to get the ambient air temperature in the forward passenger cabin zone. Move the P5-17 air temperature selector to AFT SUPPLY DUCT \u2014 the indicator should read about ambient. Then put it to FWD SUPPLY DUCT \u2014 should also read about ambient.","Problem at both positions = do \u2018More Than One Position\u2019 (steps 1\u20134). Problem gone at FWD SUPPLY DUCT but still at AFT SUPPLY DUCT = do \u2018One Position\u2019 (steps 5\u20137). Problem gone at both = intermittent fault."],
  steps:["MORE THAN ONE POSITION (N11 / S1 / wiring) \u2014 28 VDC check: lower the P5 overhead panel, get to connector D90 for the cabin temperature indicator N11. Check 28 VDC between D90 pin 2 and structure ground. No 28 VDC = repair the wiring between D90 pin 2 and C/B C00076 (P6-4 D/8 AIR CONDITIONING TEMP IND), close P5, confirm. 28 VDC present = continue.","MORE THAN ONE POSITION: resistance check between the bonding jumper at the upper left corner of the P5 forward overhead panel and airplane structure \u2014 not more than the SWPM 20-20-10 5.D value. Greater than allowed = repair the bonding jumper installation per SWPM 20-20-10. Close P5, confirm.","MORE THAN ONE POSITION: replace the cabin temperature indicator N11 (AMM 21-61-32-000-801 / 400-801). Confirm.","MORE THAN ONE POSITION: replace the air temperature selector S1. Close P5. Confirm.","ONE POSITION (T535 / S1 / wiring) \u2014 wiring check: lower the P5 overhead panel for connector D3998 on the air temperature selector S1. Disconnect D11838 from the aft passenger cabin supply duct temperature bulb T535 (AMM 21-61-30-000-803-002). Check for an open circuit D3998 pin 17 to D11838 pin B, and make sure D11838 pin A goes to ground. Open = repair the wiring, close P5, confirm. Continuity = continue.","ONE POSITION: replace the aft passenger cabin supply duct temperature bulb T535 (Duct Temperature Bulb R&I, AMM 21-61-30-000-803-002 / 400-803-002). Confirm.","ONE POSITION: replace the air temperature selector S1. Close P5. Confirm.","REPAIR CONFIRMATION: supply conditioned air with the right pack (AMM 21-00-00-800-803). On P5-17 put CONT CAB, FWD CAB and AFT CAB selectors to AUTO (12:00), run the pack 2 minutes, then put the air temperature selector to AFT SUPPLY DUCT. Indication problem gone = fixed; still there = go to the next step."],
  keywords:'aft supply duct temp indication gauge P5-17 bulb T535 N11 S1 D90 D3998 D11838 C00076 bonding jumper SWPM 20-20-10 STD-1122'},

  keywords:'fwd forward supply duct temp indication gauge P5-17 bulb T534 N11 S1 D90 D3998 D11832 C00076 bonding jumper SWPM 20-20-10 STD-1122'},
 {id:'21-61-00-810-858',task:'21-61-00-810-858',title:'Control Cabin Supply Duct Temperature Indication Problem - Fault Isolation',ata:'21-61',

  causes:['Wiring','Air temperature indicator, N11','Control cabin supply duct temperature bulb, T485','Air temperature selector, S1'],

  steps:["MORE THAN ONE POSITION (N11 / S1 / wiring) \u2014 28 VDC check: lower the P5 overhead panel, get to connector D90 for the cabin temperature indicator N11. Check 28 VDC between D90 pin 2 and structure ground. No 28 VDC = repair the wiring between D90 pin 2 and C/B C00076 (P6-4 D/8 AIR CONDITIONING TEMP IND), close P5, confirm. 28 VDC present = continue.","MORE THAN ONE POSITION: resistance check between the bonding jumper at the upper left corner of the P5 forward overhead panel and airplane structure \u2014 not more than the SWPM 20-20-10 5.D value. Greater than allowed = repair the bonding jumper installation per SWPM 20-20-10. Close P5, confirm; not satisfactory = continue.","MORE THAN ONE POSITION: replace the cabin temperature indicator N11 (AMM 21-61-32-000-801 / 400-801). Confirm; not satisfactory = continue.","MORE THAN ONE POSITION: replace the air temperature selector S1. Close P5. Confirm.","ONE POSITION (T485 / S1 / wiring) \u2014 wiring check: lower the P5 overhead panel for connector D3998 on the air temperature selector S1. Disconnect D3924 from the control cabin supply duct temperature bulb T485 (AMM 21-61-30-000-803-002). Check for an open circuit D3998 pin 19 to D3924 pin B, and make sure D3924 pin A goes to ground. Open = repair the wiring, raise P5 closed, confirm. Continuity = continue.","ONE POSITION: replace the control cabin supply duct temperature bulb T485 (Duct Temperature Bulb R&I, AMM 21-61-30-000-803-002 / 400-803-002). Confirm.","ONE POSITION: replace the air temperature selector S1. Raise P5 closed. Confirm.","REPAIR CONFIRMATION: supply conditioned air with the left pack (AMM 21-00-00-800-803). On P5-17 put CONT CAB, FWD CAB and AFT CAB selectors to AUTO (12:00), run the pack 2 minutes, then put the air temperature selector to CONT CAB SUPPLY DUCT. Indication problem gone = fixed; still there = go to the next step."],
  keywords:'cont cab flight deck supply duct temp indication gauge P5-17 bulb T485 N11 S1 D90 D3998 D3924 C00076 bonding jumper SWPM 20-20-10 STD-1122 L PACK'},
 {id:'21-61-00-810-857',task:'21-61-00-810-857',title:'Aft Passenger Cabin Temperature Indication Problem - Fault Isolation',ata:'21-61',
  eff:'DAL ALL 701-777, 801-999',
  desc:'There is a problem with the AFT PASS CAB air temperature indication shown on the P5-17 cabin temperature panel.\nNOTE: The temperature bulb is for indication only; a defective bulb or wiring will not affect the temperature control system. There is no on-wing check of the temperature bulb.',
  causes:['Aft Passenger Cabin Temperature Sensor Fan','Aft Passenger Cabin Temperature Bulb','Air Temperature Indicator, N11','Air Temperature Selector, S1','Wiring'],
  cbs:[{panel:'P6-4',row:'D',col:'8',num:'C00076',name:'AIR CONDITIONING TEMP IND'}],
  confirmLabel:'Initial evaluation',confirm:["Compare positions on the P5-17 selector: problem gone for FWD PASS CAB but still there for AFT PASS CAB = do \u2018One Position\u2019 (steps 6\u201310). Problem gone for both = intermittent fault. Problem in more than one position = do \u2018More Than One Position\u2019 (steps 1\u20135)."],
  steps:["MORE THAN ONE POSITION (N11 / S1 / wiring) \u2014 28 VDC check: lower the P5 overhead panel, get to connector D90 for the cabin temperature indicator N11. Check 28 VDC between D90 pin 2 and structure ground. No 28 VDC = repair the wiring between D90 pin 2 and C/B C00076, close P5, confirm. 28 VDC present = continue.","MORE THAN ONE POSITION: resistance check between the bonding jumper at the upper left corner of the P5 forward overhead panel and airplane structure \u2014 not more than the SWPM 20-20-10 5.D value. Greater than allowed = repair the bonding jumper installation per SWPM 20-20-10, confirm. Close P5.","MORE THAN ONE POSITION: replace the cabin temperature indicator N11 (AMM 21-61-32-000-801 / 400-801). Confirm.","MORE THAN ONE POSITION: replace the air temperature selector S1. Confirm.","ONE POSITION (aft sensor fan / aft bulb / S1 / wiring) \u2014 fan test: hold a 3 x 4 in sheet of lightweight paper over the air inlet grille of the aft passenger cabin temperature sensor assembly; the fan should hold it. If it won't: remove the sensor assembly filter (AMM 21-61-06-000-801) and check it for blockage \u2014 blocked = install a new filter (AMM 21-61-06-400-801), confirm. Filter clear = inspect the duct from the filter to the sensor \u2014 blocked = clean the duct, reinstall the filter, confirm. No blockage anywhere = reinstall the filter and replace the cabin temperature sensor fan (AMM 21-61-11-000-801 / 400-801), confirm. If the fan holds the paper, remove it and continue.","ONE POSITION: wiring check for the P5-17 panel and aft bulb. Lower the P5 overhead panel for connector D3996 on the air temperature selector S1; remove the bullnose cover per the bulb removal task (AMM 21-61-31-000-801) and disconnect the aft bulb connector. Check for an open circuit: P5-17 D3996 pin 13 to M1446 D3922 pin B, and ground to D3922 pin A (M2848 airplanes: D3996 pin 13 to D15024 pin B, ground to D15024 pin A). Open = repair the wiring, close P5, confirm. Continuity = continue.","ONE POSITION: replace the aft passenger cabin temperature bulb (Cabin Temperature Bulb R&I, AMM 21-61-31-000-801 / 400-801). Confirm.","ONE POSITION: replace the air temperature selector S1. Close P5. Confirm.","REPAIR CONFIRMATION: supply conditioned air with the right pack (AMM 21-00-00-800-803). On P5-17 put CONT CAB, FWD CAB and AFT CABIN selectors to AUTO (12:00), run the pack 2 minutes to stabilize, then put the air temperature selector to AFT PASS CAB. Indication problem gone = fixed; still there = go to the next step."],
  keywords:'aft pass cab temp indication gauge P5-17 bulb N11 S1 sensor fan filter D90 D3996 D3922 D15024 M1446 M2848 C00076 bonding jumper SWPM 20-20-10'},
 {id:'21-62-00-810-808',task:'21-62-00-810-808',title:'Aft Cabin Temperature Selector (Primary) - Fault Isolation',ata:'21-62',eff:'DAL 701-777, 801-852, 931-999',
  desc:'This task is for this maintenance message:\n(a) ZONE SELECTOR\nThis fault is for the PZTC No. 1.\nRelated data: SSM 21-51-31, SSM 21-61-14.',
  causes:['Aft Cabin Temperature Selector Switch, S4','Wiring','Pack/Zone Temperature Controller (PZTC) No. 1, M1442'],
  cbs:[{"panel": "P6-4", "row": "A", "col": "9", "num": "C01158", "name": "AIR CONDITIONING PACK CONTROL LEFT DC"}, {"panel": "P6-4", "row": "A", "col": "11", "num": "C01159", "name": "AIR CONDITIONING PACK CONTROL LEFT AC"}],
  confirmLabel:'Initial evaluation',confirm:["Do the Pack Temperature Control BITE Procedure (21-62 TASK 801). Message does not show = intermittent fault. Message shows = do the fault isolation steps.","PZTC reset: push the VERIFY switch on the controller. Red light ON = do the fault isolation steps. Green GO light ON = push RESET while the VERIFY and GO lights are ON; no further action (see 21-62 TASK SUPPORT Figure 305 for fault lights)."],
  steps:["Replace the aft cabin temperature selector switch S4 (Cabin Temperature Selector R&I, AMM 21-61-07-000-803-002 / 400-803-002). Confirm.","Wiring check (WDM 21-61-14): lower the P5 pilot overhead panel, disconnect the connector from S4, remove PZTC No. 1 M1442 (AMM 21-61-20-000-801). Check S4 to M1442 D3858A: pin 4 \u2192 C3, pin 5 \u2192 B3, pin 6 \u2192 A3. Problem = repair the wiring, reconnect S4, reinstall M1442 (AMM 21-61-20-400-801), confirm. No problem = reconnect S4 and continue.","Replace PZTC No. 1 M1442 (AMM 21-61-20-000-801 / 400-801). Confirm.","REPAIR CONFIRMATION: do the BITE procedure (21-62 TASK 801) \u2014 message does not show = fixed; still shows = next step."],
  keywords:'zone selector aft cab pztc 1 temp selector S4 M1442 D3858A WDM 21-61-14 BITE verify reset go light Figure 305'},

 {id:'21-61-00-810-864',task:'21-61-00-810-864',title:'Forward Cabin AUTO Temperature Control Does Not Operate - Fault Isolation',ata:'21-61',eff:'DAL ALL 701-777, 801-999',
  desc:'The Fwd Cabin Automatic Temperature Control does not operate.',
  causes:['Pack/Zone Temperature Control System failure','TAPRSOV, V146','Forward Cabin Duct Temperature Limit Sensor, T533','Fwd Cabin Zone Temperature Sensor Fan, M1445','Fwd Cabin Zone Temperature Sensor Filter','Separation of Sidewall Riser Ducts from Transition Duct'],
  cbs:[{"panel": "P6-4", "row": "B", "col": "2", "num": "C01167", "name": "A/C ZONE TEMP VALVE/FAN CONT FWD PASS"}, {"panel": "P6-4", "row": "B", "col": "9", "num": "C01161", "name": "AIR CONDITIONING PACK CONT RIGHT DC"}, {"panel": "P6-4", "row": "B", "col": "11", "num": "C01162", "name": "AIR CONDITIONING PACK CONT RIGHT AC"}],
  confirmLabel:'Initial evaluation',confirm:["Supply conditioned air to the passenger compartment with both packs (AMM 21-00-00-800-803). Make sure the FWD CAB selector on P5-17 is in AUTO.","Examine the passenger cabin sidewall panels on both sides near the floor adjacent to the forward wing-to-body fairing: panels must not look expanded inboard just above floor level and should match the contour of adjacent panels; listen for whistling noises that could indicate leaking ducts. Either condition present = do the fault isolation steps (see step 6).","Let the packs run a few minutes to stabilize, then put FWD CAB to W. Temperature in the forward cabin increases = intermittent fault; remove conditioned air (AMM 21-00-00-800-804). Does not increase = do the fault isolation steps."],
  steps:["BITE test of the right pack/zone temperature controller M1443 (Pack Temperature Control BITE, 21-62 TASK 801). Fault shown = do the corrective action for the message, then both packs on, FWD CAB to AUTO, stabilize, FWD CAB to W \u2014 temperature increases = fixed; remove conditioned air (800-804). No fault = continue.","Replace the TAPRSOV V146 \u2014 AMM 21-62-01-000-801 / 400-801.","TAPRSOV V146 test: remove safety tags and close C/Bs on P6-4 \u2014 C00263 (C/5 PACK CONT VALVES R), C00262 (C/6 PACK CONT VALVES L), C01172 (D/9 TRIM AIR PRESS). Supply pneumatic pressure with the APU (AMM 36-00-00-860-803). On P5-10: L and R PACK to AUTO, BLEED 1 and 2 ON, APU BLEED ON. On P5-17: CONT CAB, FWD CAB and AFT CAB selectors midway between C and AUTO, TRIM AIR ON, AIR TEMP selector to FWD SUPPLY DUCT. Run the packs until the indication stops changing; record the supply duct temperature at each of the three SUPPLY DUCT positions (CONT CAB, FWD CAB, AFT CAB). Set FWD CAB to W (full warm) \u2014 the forward passenger cabin supply duct should read at least 10\u00b0F warmer than the control cabin and aft zones. Higher = fixed. Not higher = continue.","Resistance check of the forward cabin duct temperature limit sensor T533 (Duct Temperature Limit Sensor Test, AMM 21-61-04-000-805-002). If you replaced T533 and the fault is gone = fixed. Resistance satisfactory = continue.","Forward cabin zone temperature sensor filter and fan: hold a 3 x 4 in sheet of lightweight paper over the air inlet grille of the sensor assembly. Fan does not hold it = remove the filter (AMM 21-61-06-000-801) and check for dirt/blockage. Dirty = install a new filter (AMM 21-61-06-400-801). Not dirty = replace the forward cabin zone temperature sensor fan (AMM 21-61-11-000-801 / 400-801). Either way, confirm: both packs on, FWD CAB AUTO, stabilize, FWD CAB to W \u2014 temperature increases = fixed; remove conditioned air (800-804). Fan holds the paper = remove conditioned air and continue.","If the initial evaluation showed sidewall panel damage near the floor by the forward wing-to-body fairing: remove the applicable sidewall panel(s) (AMM 25-21-46-000-801), then inspect and repair the sidewall risers \u2014 Sidewall Riser Ducts/Transition Duct Inspection AMM 21-23-02-212-801 and Repair AMM 21-23-02-360-801."],
  keywords:'fwd forward cab auto temp control inop zone temperature trim air M1443 M1445 TAPRSOV V146 T533 C00262 C00263 C01172 sensor fan filter BITE W full warm sidewall riser duct wing-to-body fairing whistling'},

 {id:'21-62-00-810-812',task:'21-62-00-810-812',title:"Flight Deck Duct Temperature Sensor (Primary) - Fault Isolation",ata:'21-62',eff:'DAL 701-777, 801-852, 931-999',
  desc:'This task is for this maintenance message:\n(a) FLT DECK DUCT SENSOR\nThe right pack/zone temperature controller has detected a short or an open circuit from the control cabin duct temperature sensor.\nRelated data: SSM 21-61-11, WDM 21-61-11.',

  confirmLabel:'Initial evaluation',confirm:["Do the Pack Temperature Control BITE Procedure (21-62 TASK 801). Message does not show = intermittent fault. Message shows = do the fault isolation steps."],
  steps:["Sensor check: open 117A (Electronic Equipment Access Door). Disconnect D3884 from the control cabin duct temperature sensor T478. Check for an open or a short between pins 1 and 2 of the sensor. Short or open = replace the control cabin duct temperature sensor (Primary) T478 (Duct Temperature Limit Sensor R&I, AMM 21-61-04-000-803-002 / 400-803-002), BITE (21-62 TASK 801) \u2014 no message = fixed. Not shorted/open = continue.","Wiring check, sensor to right PZTC M1443: remove M1443 (AMM 21-61-20-000-801). Check D3884 (sensor) to D3860A (controller): pin 1 \u2192 B5, pin 2 \u2192 A5. Problem = repair the wiring, reconnect the sensor, reinstall M1443 (AMM 21-61-20-400-801), BITE \u2014 no message = fixed. No problem = reconnect the sensor and continue.","Replace the right pack/zone temperature controller M1443 (AMM 21-61-20-000-801 / 400-801). BITE (21-62 TASK 801) \u2014 no message = fixed."],
  keywords:'flt deck duct sensor control cabin duct temp sensor T478 pztc 2 M1443 D3884 D3860A WDM 21-61-11 117A E/E bay BITE'},
 {id:'21-62-00-810-810',task:'21-62-00-810-810',title:"Flight Deck Cabin Temperature Sensor (Primary) - Fault Isolation",ata:'21-62',eff:'DAL 701-777, 801-852, 931-999',

 {id:'21-62-00-810-849',task:'21-62-00-810-849',title:"Cannot Cool Cabins with All Temperature Selectors in Full COLD - Fault Isolation",ata:'21-62',eff:'DAL ALL 701-777, 801-999',
